<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>홍길동 디지털 명함</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #19342b;
      --muted: #648174;
      --accent: #249565;
      --accent-dark: #16734d;
      --line: #e1eee5;
      --surface: #ffffff;
      --canvas: #f3faf4;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      padding: 24px 16px;
    }
    .page {
      width: min(100%, 440px);
      margin: 0 auto;
    }
    .card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(25, 45, 80, .10);
    }
    .cover {
      height: 116px;
      background:
        radial-gradient(circle at 82% 16%, rgba(255,255,255,.36) 0 8%, transparent 8.5%),
        radial-gradient(circle at 72% 80%, rgba(255,255,255,.16) 0 17%, transparent 17.5%),
        linear-gradient(130deg, #2c9c70, #62c992 58%, #a5e7b1);
    }
    .content { padding: 0 24px 24px; }
    .avatar {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      margin-top: -44px;
      border: 5px solid var(--surface);
      border-radius: 50%;
      background: #e5f6e9;
      color: var(--accent-dark);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.06em;
    }
    .name-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin-top: 13px;
    }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 32px); line-height: 1.15; letter-spacing: -.045em; }
    .title { color: var(--muted); font-size: 15px; font-weight: 650; }
    .intro { margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
    .section-label {
      margin: 26px 0 11px;
      color: #6d8778;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      padding: 8px 12px;
      border: 1px solid #d7eedf;
      border-radius: 999px;
      background: #f0fbf3;
      color: #27714e;
      font-size: 13px;
      font-weight: 700;
    }
    .contact-list { border-top: 1px solid var(--line); margin-top: 22px; }
    .contact-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 62px;
      border-bottom: 1px solid var(--line);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #f0f7f2;
      color: #42634f;
      font-size: 16px;
    }
    .contact-copy { min-width: 0; }
    .contact-label { display: block; margin-bottom: 3px; color: #8792a3; font-size: 11px; }
    .contact-value {
      display: block;
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .copy-button {
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: #38634b;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 14px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }
    .button:hover { background: var(--accent-dark); }
    .button:active { transform: translateY(1px); }
    .button.secondary { background: #eaf6ee; color: #276244; }
    .button.secondary:hover { background: #dff0e4; }
    .button.full { grid-column: 1 / -1; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 11px 16px;
      border-radius: 12px;
      background: #193b2a;
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    :focus-visible { outline: 3px solid #83d7a3; outline-offset: 3px; }
    @media (max-width: 360px) {
      body { padding: 14px 10px; }
      .content { padding-right: 18px; padding-left: 18px; }
      .actions { grid-template-columns: 1fr; }
      .button.full { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card" aria-labelledby="person-name">
      <div class="cover" aria-hidden="true"></div>
      <div class="content">
        <div class="avatar" aria-hidden="true">홍</div>
        <div class="name-row">
          <h1 id="person-name">홍길동</h1>
          <span class="title">사원</span>
        </div>
        <p class="intro">안녕하세요</p>

        <h2 class="section-label">담당 업무</h2>
        <div class="tags" aria-label="담당 업무">
          <span class="tag">사무</span>
          <span class="tag">회계</span>
          <span class="tag">세금계산서</span>
        </div>

        <div class="contact-list" aria-label="연락처">
          <div class="contact-row">
            <span class="icon" aria-hidden="true">☎</span>
            <div class="contact-copy">
              <span class="contact-label">전화</span>
              <a class="contact-value" href="tel:01099995555">010-9999-5555</a>
            </div>
            <span aria-hidden="true"></span>
          </div>
          <div class="contact-row">
            <span class="icon" aria-hidden="true">✉</span>
            <div class="contact-copy">
              <span class="contact-label">이메일</span>
              <a class="contact-value" href="mailto:pjy@example.com">pjy@example.com</a>
            </div>
            <button class="copy-button" id="copy-email" type="button">주소 복사</button>
          </div>
        </div>

        <div class="actions">
          <a class="button" href="tel:01099995555">☎ 전화 걸기</a>
          <a class="button secondary" href="mailto:pjy@example.com">✉ 메일 보내기</a>
          <a class="button secondary full" href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AFN%3A%ED%99%8D%EA%B8%B8%EB%8F%99%0ATITLE%3A%EC%82%AC%EC%9B%90%0ATEL%3BTYPE%3DCELL%3A010-9999-5555%0AEMAIL%3Apjy%40example.com%0ANOTE%3A%EC%82%AC%EB%AC%B4%2C%20%ED%9A%8C%EA%B3%84%2C%20%EC%84%B8%EA%B8%88%EA%B3%84%EC%82%B0%EC%84%9C%20%7C%20%EC%95%88%EB%85%95%ED%95%98%EC%84%B8%EC%9A%94%0AEND%3AVCARD" download="hong-gildong.vcf">＋ 연락처 저장</a>
        </div>
      </div>
    </article>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const copyButton = document.getElementById('copy-email');
    const toast = document.getElementById('toast');
    let toastTimer;

    async function copyEmail() {
      const email = 'pjy@example.com';
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(email);
        } else {
          const field = document.createElement('textarea');
          field.value = email;
          field.setAttribute('readonly', '');
          field.style.position = 'fixed';
          field.style.opacity = '0';
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand('copy');
          field.remove();
          if (!copied) throw new Error('copy failed');
        }
        showToast('메일 주소를 복사했습니다.');
      } catch {
        showToast('복사할 수 없습니다. 메일 주소를 길게 눌러 복사해 주세요.');
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    copyButton.addEventListener('click', copyEmail);
  </script>
</body>
</html>
